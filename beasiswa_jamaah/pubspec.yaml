name: beasiswa_jamaah
description: "Aplikasi manajemen beasiswa jamaah tetap untuk anak yatim/piatu dan keluarga kurang mampu."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  # State management
  provider: ^6.1.2
  # Database lokal
  sqflite: ^2.4.2
  # Path utilities
  path: ^1.9.0
  path_provider: ^2.1.5
  # Format angka dan tanggal (Rupiah, dll)
  intl: ^0.20.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
